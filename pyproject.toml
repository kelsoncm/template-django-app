[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-newapp"
version = "0.1.0"
description = "{{DESCRIPTION}}"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "{{AUTHOR}}", email = "you@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2.19,<6.2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.17.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14",
    "doc8>=2.0",
]
docs = [
    "sphinx>=9.1,<10",
    "furo>=2025.12.19",
]

[project.urls]
Homepage = "https://github.com/{{OWNER}}/django-newapp"
Documentation = "https://{{OWNER}}.github.io/django-newapp/"
Issues = "https://github.com/{{OWNER}}/django-newapp/issues"
Changelog = "https://github.com/{{OWNER}}/django-newapp/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["django_newapp*"]

[tool.setuptools.package-data]
django_newapp = ["templates/**/*", "static/**/*", "locale/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=django_newapp --cov-report=term-missing"

[tool.coverage.run]
source = ["django_newapp"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "DJ"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"**/migrations/*" = ["E501"]
