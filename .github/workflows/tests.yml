name: Tests

on:
  push:
    branches: [main, "issues/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff, doc8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: doc8
        run: doc8 docs --max-line-length 120

  test:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python-version: "3.10", django-version: "5.2"}
          - {python-version: "3.13", django-version: "5.2"}
          - {python-version: "3.12", django-version: "6.0"}
          - {python-version: "3.14", django-version: "6.1"}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]" "Django~=${{ matrix.django-version }}.0"

      - name: Pytest (coverage must stay at 100%)
        run: pytest
